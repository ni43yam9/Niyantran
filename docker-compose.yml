services:
  db:
    image: postgres:16-alpine
    container_name: niyantra_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-niyantra_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-niyantra_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-niyantra_prod}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-niyantra_user} -d ${POSTGRES_DB:-niyantra_prod}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: niyantra_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      APP_NAME: "NIYANTRA Production API"
      DATABASE_URL: postgresql://${POSTGRES_USER:-niyantra_user}:${POSTGRES_PASSWORD:-niyantra_secure_pass_2026}@db:5432/${POSTGRES_DB:-niyantra_prod}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-niyantra-super-secret-production-key-2026-secure-random-64-bytes}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:4173,http://127.0.0.1:5173}
    command: >
      sh -c "alembic upgrade head &&
             uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --workers 2"

volumes:
  postgres_data:
