databases:
  - name: niyantra-db
    databaseName: niyantra
    user: niyantra_user
    plan: free # Free tier 1GB PostgreSQL
    region: oregon

services:
  # Backend API Web Service
  - type: web
    name: niyantra-backend
    env: python
    region: oregon
    plan: free # Free web service (0.1 CPU, 512MB RAM)
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "alembic upgrade head && uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: niyantra-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: CORS_ORIGINS
        value: "https://niyantra-frontend.onrender.com,https://niyantra.vercel.app"

  # Frontend React + Vite Static Site
  - type: static
    name: niyantra-frontend
    rootDir: .
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://niyantra-backend.onrender.com/api
